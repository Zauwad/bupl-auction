<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Deep Gold Shadow -->
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Cricket Ball Red Gradient -->
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="85%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>

    <!-- Golden Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Square Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#fbbf24" stroke-width="8" stroke-opacity="0.35"/>

  <!-- Subtle Radial Ambient Light behind Icon -->
  <circle cx="256" cy="240" r="150" fill="#fbbf24" opacity="0.12" filter="blur(30px)"/>

  <!-- Golden Trophy Handles -->
  <path d="M 145 150 C 100 150, 90 235, 140 270 C 158 282, 175 285, 195 285" fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round"/>
  <path d="M 367 150 C 412 150, 422 235, 372 270 C 354 282, 337 285, 317 285" fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round"/>

  <!-- Trophy Cup Body -->
  <path d="M 160 130 L 352 130 C 352 130, 350 250, 310 295 C 285 324, 268 335, 256 335 C 244 335, 227 324, 202 295 C 162 250, 160 130, 160 130 Z" fill="url(#goldDark)"/>
  <path d="M 168 136 L 344 136 C 344 136, 342 245, 305 287 C 282 313, 266 324, 256 324 C 246 324, 230 313, 207 287 C 170 245, 168 136, 168 136 Z" fill="url(#goldGrad)"/>

  <!-- Trophy Stem & Pedestal Base -->
  <path d="M 238 335 L 274 335 L 280 395 L 232 395 Z" fill="url(#goldDark)"/>
  <path d="M 242 335 L 270 335 L 275 390 L 237 390 Z" fill="url(#goldGrad)"/>
  <!-- Podium Base Tier 1 -->
  <rect x="200" y="395" width="112" height="18" rx="6" fill="url(#goldDark)"/>
  <rect x="204" y="395" width="104" height="14" rx="4" fill="url(#goldGrad)"/>
  <!-- Podium Base Tier 2 -->
  <rect x="175" y="413" width="162" height="25" rx="8" fill="url(#goldDark)"/>
  <rect x="180" y="415" width="152" height="20" rx="6" fill="url(#goldGrad)"/>

  <!-- Centered Cricket Ball inside Cup -->
  <circle cx="256" cy="205" r="54" fill="url(#ballGrad)" stroke="#fbbf24" stroke-width="4"/>
  <!-- Ball Seam Curve -->
  <path d="M 230 162 C 246 182, 252 225, 236 250" fill="none" stroke="#fef08a" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="2,6"/>
  <path d="M 236 164 C 252 184, 258 227, 242 252" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Top Crown / Gavel Star Accent -->
  <path d="M 256 82 L 263 98 L 280 98 L 266 108 L 271 124 L 256 114 L 241 124 L 246 108 L 232 98 L 249 98 Z" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
</svg>
